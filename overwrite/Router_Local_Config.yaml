# ==========================================================
# Router_Local_Config —— 本机 OpenClash 配置快照（覆写模块）
# ==========================================================
# 来源：本机 UCI openclash.@openclash[0] 与当前运行配置文件
# 用途：把本机现有配置固化为可复用模块，便于换订阅/重装后一键还原
# 状态：enable=0（未启用）。在 运行状态页 → 覆写模块 中勾选本模块即可启用
# 注意：启用或修改后需重启核心才生效；未列出的键表示本模块不覆写
# 安全：本模块不含任何凭据（控制面板密码、订阅 token、authentication）
# ==========================================================

[General]

# --- 运行模式与端口 ---
  # EN_MODE (插件运行模式（fake-ip/redir-host，可加 -tun/-mix 后缀）)
  EN_MODE = fake-ip
  # PROXY_MODE (代理模式（rule 规则 / global 全局 / direct 直连）)
  PROXY_MODE = rule
  # DNS_PORT (DNS 监听端口)
  DNS_PORT = 7874
  # PROXY_PORT (Redir 代理端口)
  PROXY_PORT = 7892
  # TPROXY_PORT (TPROXY 代理端口)
  TPROXY_PORT = 7895
  # HTTP_PORT (HTTP 代理端口)
  HTTP_PORT = 7890
  # SOCKS_PORT (SOCKS 代理端口)
  SOCKS_PORT = 7891
  # MIXED_PORT (混合代理端口（HTTP+SOCKS）)
  MIXED_PORT = 7893
  # CN_PORT (控制面板端口)
  CN_PORT = 9090
  # ROUTER_SELF_PROXY (路由器自身走代理（0 禁用 / 1 启用）)
  ROUTER_SELF_PROXY = 1

# --- DNS 相关 ---
  # ENABLE_REDIRECT_DNS (DNS 重定向模式（0 禁用 / 1 Dnsmasq Redirect / 2 Firewall Redirect）)
  ENABLE_REDIRECT_DNS = 1
  # ENABLE_CUSTOM_DNS (自定义 DNS（0 插件不覆写 / 1 启用插件内置规则）)
  ENABLE_CUSTOM_DNS = 1
  # ENABLE_RESPECT_RULES (DNS 查询遵循分流规则（0 插件不覆写 / 1 启用）)
  ENABLE_RESPECT_RULES = 1
  # APPEND_DEFAULT_DNS (自动追加 default-nameserver（0 不覆写 / 1 启用）)
  APPEND_DEFAULT_DNS = 0
  # APPEND_WAN_DNS (追加上游分配 DNS（0 不覆写 / 1 启用）)
  APPEND_WAN_DNS = 0
  # STORE_FAKEIP (fake-ip 缓存持久化（0 不覆写 / 1 启用）)
  STORE_FAKEIP = 1
  # CUSTOM_FAKEIP_FILTER (启用 Fake-IP-Filter（0 不覆写 / 1 启用插件内置规则）)
  CUSTOM_FAKEIP_FILTER = 1
  # CUSTOM_FAKEIP_FILTER_MODE (Fake-IP 过滤模式（blacklist/whitelist）)
  CUSTOM_FAKEIP_FILTER_MODE = blacklist
  # CUSTOM_FALLBACK_FILTER (自定义 Fallback-Filter（0 不覆写 / 1 启用）)
  CUSTOM_FALLBACK_FILTER = 0
  # CUSTOM_HOST (自定义 Hosts（0 不覆写 / 1 启用插件内置规则）)
  CUSTOM_HOST = 0
  # CUSTOM_NAME_POLICY (自定义 Nameserver-Policy（0 不覆写 / 1 启用插件内置规则）)
  CUSTOM_NAME_POLICY = 0
  # FAKEIP_RANGE (Fake-IP 地址段（IPv4 CIDR）)
  FAKEIP_RANGE = 198.18.0.1/16
  # FAKEIP_RANGE6 (Fake-IP 地址段（IPv6 CIDR）)
  FAKEIP_RANGE6 = fdfe:dcba:9876::1/64

# --- 域名嗅探 ---
  # ENABLE_META_SNIFFER (启用域名嗅探（0 不覆写 / 1 启用）)
  ENABLE_META_SNIFFER = 1
  # ENABLE_META_SNIFFER_PURE_IP (强制嗅探纯 IP 连接（0 不覆写 / 1 启用）)
  ENABLE_META_SNIFFER_PURE_IP = 1
  # ENABLE_META_SNIFFER_CUSTOM (启用自定义嗅探规则（0 不覆写 / 1 启用）)
  ENABLE_META_SNIFFER_CUSTOM = 0

# --- IPv6 相关 ---
  # IPV6_ENABLE (启用 IPv6（0 禁用 / 1 启用）)
  IPV6_ENABLE = 1
  # IPV6_MODE (IPv6 代理模式（0 TProxy / 1 Redirect / 2 TUN / 3 Mix）)
  IPV6_MODE = 3
  # IPV6_DNS (启用 IPv6 DNS（0 禁用 / 1 启用）)
  IPV6_DNS = 1

# --- 代理与转发 ---
  # ENABLE_UDP_PROXY (启用 UDP 代理（0 禁用 / 1 启用）)
  ENABLE_UDP_PROXY = 0
  # DISABLE_UDP_QUIC (禁用 UDP QUIC（0 启用 / 1 禁用）)
  DISABLE_UDP_QUIC = 0
  # ENABLE_TCP_CONCURRENT (启用 TCP 并发（0 不覆写 / 1 启用）)
  ENABLE_TCP_CONCURRENT = 1
  # ENABLE_UNIFIED_DELAY (启用统一延迟计算（0 不覆写 / 1 启用）)
  ENABLE_UNIFIED_DELAY = 1
  # DISABLE_QUIC_GO_GSO (禁用 QUIC GO GSO（0 不覆写 / 1 启用）)
  DISABLE_QUIC_GO_GSO = 0
  # FIND_PROCESS_MODE (进程查找模式（0 不覆写 / off / always / strict）)
  FIND_PROCESS_MODE = 0

# --- 防火墙与访问控制 ---
  # INTRANET_ALLOWED (仅允许内网访问（0 禁用 / 1 启用）)
  INTRANET_ALLOWED = 1
  # LAN_INTERFACE_NAME (LAN 接口名称)
  LAN_INTERFACE_NAME = br-lan
  # BYPASS_GATEWAY_COMPATIBLE (旁路网关兼容模式（0 禁用 / 1 启用）)
  BYPASS_GATEWAY_COMPATIBLE = 0
  # SKIP_PROXY_ADDRESS (跳过代理地址（0 禁用 / 1 启用）)
  SKIP_PROXY_ADDRESS = 1

# --- Smart 内核 ---
  # AUTO_SMART_SWITCH (启用 Smart 自动切换（0 不覆写 / 1 启用）)
  AUTO_SMART_SWITCH = 1
  # SMART_ENABLE_LGBM (启用 LightGBM 模型（0 不覆写 / 1 启用）)
  SMART_ENABLE_LGBM = 0
  # SMART_POLICY_PRIORITY (Smart 策略组节点权重（pattern:factor;...，<1 降权 / >1 加权，默认 1，按节点名匹配）；当前不用 Smart 切换，故注释)
  # SMART_POLICY_PRIORITY = 香港:1.5;新加坡:1.3;日本:1.2
  # SMART_PREFER_ASN (Smart 优先按 ASN 选路（0 不覆写 / 1 启用）)
  SMART_PREFER_ASN = 0
  # SMART_TOLERANCE (Smart 策略组切换容差（毫秒）)
  SMART_TOLERANCE = 0
  # SMART_COLLECT (模型训练数据收集（0 不覆写 / 1 启用）)
  SMART_COLLECT = 0
  # LGBM_AUTO_UPDATE (LGBM 模型自动更新（0 不覆写 / 1 启用）)
  LGBM_AUTO_UPDATE = 1
  # LGBM_UPDATE_INTERVAL (LGBM 模型更新间隔（小时）)
  LGBM_UPDATE_INTERVAL = 72
  # LGBM_CUSTOM_URL (LGBM 模型自定义下载地址（URL）)
  LGBM_CUSTOM_URL = https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin

# --- 分流与策略组 ---
  # CHINA_IP_ROUTE (IPv4 绕过 IP 模式（0 禁用 / 1 绕过大陆 / 2 回国）)
  CHINA_IP_ROUTE = 1
  # CHINA_IP6_ROUTE (IPv6 绕过 IP 模式（0 禁用 / 1 绕过大陆 / 2 回国）)
  CHINA_IP6_ROUTE = 1
  # ENABLE_CUSTOM_CLASH_RULES (启用用户自定义规则（0 禁用 / 1 使用插件规则）)
  ENABLE_CUSTOM_CLASH_RULES = 1
  # ENABLE_RULE_PROXY (仅代理命中规则的流量（0 禁用 / 1 启用）)
  ENABLE_RULE_PROXY = 0
  # TOLERANCE (URL-Test 策略组切换灵敏度（毫秒）)
  TOLERANCE = 100
  # URLTEST_INTERVAL_MOD (测速（连通性）间隔修改（秒 / 0 不覆写）)
  URLTEST_INTERVAL_MOD = 0
  # URLTEST_ADDRESS_MOD (测速（连通性）地址修改（URL / 0 不覆写）)
  URLTEST_ADDRESS_MOD = 0
  # GITHUB_ADDRESS_MOD (GitHub 地址修改（URL / 0 不覆写）)
  GITHUB_ADDRESS_MOD = 0

# --- 大陆 IP 库更新 ---

# ==========================================================
# 【重要】[YAML] 段的引号与缩进规则（违反则整段静默失效）
#
# 1) 双引号会被 shell 吃掉。插件读取 [YAML] 时执行：
#      yaml_content="${yaml_content}$(eval "echo \"$line\"")"
#    双引号在 eval 中作为语法被剥离：
#      - "*.lan"   ->   - *.lan     （YAML 别名语法，解析直接报错）
#    所以含 * ? + 等特殊字符的条目必须用单引号（单引号可穿透 eval）：
#      - '*.lan'    <- 正确
#
# 2) 同一列表内所有条目的缩进必须完全一致。
#    缩进不同 → 被静默解析成一个多行标量（不报错，但语义错误）。
#
# 3) 注释（# 开头）会被插件整行丢弃，缩进随意，仅供阅读。
# ==========================================================

[YAML]

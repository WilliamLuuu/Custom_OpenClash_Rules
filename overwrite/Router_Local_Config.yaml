  # 原因见 dns/resolver.go:299 ipExchange() —— 判定顺序为 policy -> fallback -> main
  #
  # (1) nameserver-policy 命中即 return，MosDNS 永不被查询
  #     原 geosite:cn / geosite:geolocation-!cn 两条覆盖了绝大多数域名
  #     置空后所有域名回落到 nameserver(tcp://192.168.3.1:5335) 即 MosDNS
  nameserver-policy!: {}
  #
  # (2) 节点域名解析单独走公共 DoH，避免 MosDNS 故障时节点无法解析(引导环)
  #     仅在 respect-rules: true 时启用，此处保留
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  #
  # (3) fallback + fallback-filter 也必须清空，存在两处旁路：
  #     a) fallback-filter.geosite: [gfw] -> gfw 域名只查 fallback，MosDNS 被跳过
  #        (resolver.go:279 shouldOnlyQueryFallback 命中即独占)
  #     b) fallback-filter.geoip: CN -> MosDNS 返回非 CN 应答时被判为需回退，
  #        结果被 cloudflare/google DoH 抢答覆盖 (resolver.go:335 shouldIPFallback)
  fallback!: []
  fallback-filter!: {}
  enhanced-mode: fake-ip
  fake-ip-range6: fdfe:dcba:9876::1/64
  respect-rules: true
  fake-ip-filter-mode: blacklist
  direct-nameserver:
    - tcp://192.168.3.1:5335
# --- 域名嗅探（还原被 fake-ip 掩盖的真实域名）---
sniffer:
  enable: true
  override-destination: true
  sniff:
    QUIC:
      ports:
        - 443
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
  force-domain:
    # NetFlix
    - '+.netflix.com'
    - '+.nflxvideo.net'
    # Amazon AWS
    - '+.amazonaws.com'
    # Disney
    - '+.media.dssott.com'
  skip-domain:
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '+.oray.com'
    - '+.sunlogin.net'
    - '+.push.apple.com'
  parse-pure-ip: true
# --- TUN 相关（本机 auto-route/auto-redirect 均为关闭）---
tun:
  enable: true
  stack: mixed
  device: utun
  dns-hijack:
    - 127.0.0.1:53
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false
  disable-icmp-forwarding: false
